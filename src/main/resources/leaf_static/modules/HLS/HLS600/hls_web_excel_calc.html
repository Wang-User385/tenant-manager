    <body>
    <div id="savesuccess"></div>
    <div id="spreadsheet" style="width: 98%; height: 90%"></div>
    <script>
        var excelId = '${RequestParameters.excelId!}';
        var sourceDocumentId = '${RequestParameters.sourceDocumentId!}';
        var sourceDocumentCategory = '${RequestParameters.sourceDocumentCategory!}';
        var resultId = '${RequestParameters.resultId!}';
        var readOnly = '${RequestParameters.readOnly!"N"}';
        var finStatementName = '${RequestParameters.finStatementName!}';

        function fullScreen(){
            if(document.isFullScreen || document.mozIsFullScreen || document.webkitIsFullScreen){
                exitScreen();
            }
            var el = document.documentElement;
            var rfs = el.requestFullScreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullScreen;

            if (rfs) {
                rfs.call(el);
            }else if (typeof window.ActiveXObject !== "undefined") {
                //for IE，这里其实就是模拟了按下键盘的F11，使浏览器全屏
                var wscript = new ActiveXObject("WScript.Shell");
                if (wscript != null) {
                    wscript.SendKeys("{F11}");
                }
            }
        }

        function exitScreen(){
            var el = document;
            var cfs = el.cancelFullScreen || el.webkitCancelFullScreen || el.mozCancelFullScreen || el.exitFullScreen;

            if (cfs) {
                cfs.call(el);
            }
            else if (typeof window.ActiveXObject !== "undefined") {
                var wscript = new ActiveXObject("WScript.Shell");
                if (wscript != null) {
                    wscript.SendKeys("{F11}");
                }
            }
        }

        function zip_str(strData) {
            return btoa(pako.gzip(encodeURIComponent(strData), {to: 'string'}));
        }

        function unzip_str(b64Data){
            var strData   = atob(b64Data);
            var charData  = strData.split('').map(function(x){return x.charCodeAt(0);});
            var binData   = new Uint8Array(charData);
            var data    = pako.inflate(binData);
            array = new Uint16Array(data)
            var res = '';
            var chunk = 8 * 1024;
            var i;
            for (i = 0; i < array.length / chunk; i++) {
                res += String.fromCharCode.apply(null, array.slice(i * chunk, (i + 1) * chunk));
            }
            res += String.fromCharCode.apply(null, array.slice(i * chunk));

            strData = res
            return decodeURIComponent(strData);
        }


        var
         saveObj = {
             type: "button",
             text: "保存",
             showText: "both",
            spriteCssClass: "k-icon k-font-icon  k-i-checkmark",
            click: function (e) {
                var mask = jQuery("body").mLoading({
                    text:"正在计算。。。"
                });
                setTimeout(function(){
                    var spreadsheet = $("#spreadsheet").data('kendoSpreadsheet');
                    var sheets = kendo.stringify(spreadsheet.toJSON().sheets);
                    sheets=zip_str(sheets);
                    $.ajax({
                        type: 'post',
                        url: '${base.contextPath}/hls/web/excel/calc/sheets/submit?resultId='+ resultId + '&excelId=' + excelId + '&sourceDocumentId='+sourceDocumentId+'&sourceDocumentCategory='+sourceDocumentCategory + '&finStatementName='+finStatementName,
                        contentType: "text/plain; charset=utf-8",
                        data: sheets,
                        success: function (datas) {
                            mask.destroy();
                            if (datas.success) {
                                resultId = datas.rows[0].resultId;
                                kendo.ui.showInfoDialog({
                                    message: '保存成功！'
                                });
                            } else {
                                kendo.ui.showInfoDialog({
                                    message: datas.message
                                });
                            }
                        }
                    });
                },200);
            }
        };
        var defaultTools = {
            home : [
                saveObj,
                'open',
                'exportAs',
                [ 'cut', 'copy', 'paste' ],
                [ 'bold', 'italic', 'underline' ],
                {
                    type : "button",
                    text : "Custom",
                    spriteCssClass : "k-icon k-font-icon k-i-deny",
                    click : function(e) {
                        $.each(getSelectionBlock('#spreadsheet'),function (index,item) {
                            if(item.enable()){
                                item.enable(false);
                            }else{
                                item.enable(true);
                            }
                        });

                    }
                }, 'hyperlink', 'backgroundColor', 'textColor', 'borders',
                'fontSize', 'fontFamily', 'alignment', 'textWrap',
                [ 'formatDecreaseDecimal', 'formatIncreaseDecimal' ],
                'format',
                {
                    type : "button",
                    text : "Custom",
                    spriteCssClass : "k-icon k-font-icon k-i-deny",
                    click : function(e) {
                        $.each(getSelectionBlock('#spreadsheet'),function (index,item) {
                            if( item.format().toString().indexOf('mm') != -1 ){
                                item.format('yyyy/m/d');
                            }
                        });
                    }
                }, 'merge', 'freeze', 'filter', 'toggleGridlines',
                {
                    type: "button",
                    text: "Custom",
                    icon: "k-icon k-i-windows",
                    click: function (e) {
                        fullScreen();
                    }
                }
            ]
        };

        if (readOnly == 'Y') {
            defaultTools = {
                home: [
                    {
                        type: "button",
                        text: "Custom",
                        spriteCssClass: "k-icon k-font-icon k-i-refresh",
                        click: function (e) {
                            loadSpreadSheet(true);
                        }
                    },
                    'open',
                    'exportAs'
                ]
            }
        }
        $.ajax({
            type : 'post',
            url : '${base.contextPath}/hls/web/excel/calc/result/sheets/query?resultId='+ resultId + '&excelId=' + excelId + '&sourceDocumentId='+sourceDocumentId+'&sourceDocumentCategory='+sourceDocumentCategory + '&finStatementName='+finStatementName,
            dataType:'text',
            async: false,
            success : function(datas) {
                if(datas){
                    $("#spreadsheet").kendoSpreadsheet(
                        {
                            toolbar :defaultTools,
                            sheets: JSON.parse(unzip_str(datas))
                        });
                }else{
                    $("#spreadsheet").kendoSpreadsheet(
                        {
                            toolbar :defaultTools
                        });
                }
            }
        });

    </script>
    </div>
    </body>
