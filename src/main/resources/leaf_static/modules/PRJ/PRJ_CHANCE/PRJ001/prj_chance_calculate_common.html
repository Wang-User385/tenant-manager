        var POW = Math.pow;
        // 乘法
        mul = function(a, b) {
            var m = 0, s1 = String(a), s2 = String(b), l1 = s1.indexOf('.'), l2 = s2
                .indexOf('.'), e1 = s1.indexOf('e'), e2 = s2.indexOf('e');
            if (e1 != -1) {
                m -= Number(s1.substr(e1 + 1));
                s1 = s1.substr(0, e1);
            }
            if (e2 != -1) {
                m -= Number(s2.substr(e2 + 1));
                s2 = s2.substr(0, e2);
            }
            if (l1 != -1)
                m += s1.length - l1 - 1;
            if (l2 != -1)
                m += s2.length - l2 - 1;
            return Number(s1.replace('.', '')) * Number(s2.replace('.', ''))
                / POW(10, m);
        }

        // 除法
        div = function(a, b) {
            var re = String(a / b), i = re.indexOf('.');
            if (i != -1) {
                re = Number(re).toFixed(16 - i - 1)
            }
            return Number(re);
        }

        // 加法
        plus = function(a, b) {
            var m1 = 0, m2 = 0, m3, s1 = String(a), s2 = String(b), l1 = s1
                .indexOf('.'), l2 = s2.indexOf('.'), e1 = s1.indexOf('e'), e2 = s2
                .indexOf('e');
            if (e1 != -1) {
                m1 -= Number(s1.substr(e1 + 1));
                s1 = s1.substr(0, e1);
            }
            if (e2 != -1) {
                m2 -= Number(s2.substr(e2 + 1));
                s2 = s2.substr(0, e2);
            }
            if (l1 != -1)
                m1 += s1.length - l1 - 1;
            if (l2 != -1)
                m2 += s2.length - l2 - 1;
            if (m2 > m1) {
                m3 = m2;
                m1 = m2 - m1;
                m2 = 0;
            } else if (m1 > m2) {
                m3 = m1;
                m2 = m1 - m2;
                m1 = 0;
            } else {
                m3 = m1;
                m1 = m2 = 0;
            }
            return (Number(s1.replace('.', '')) * POW(10, m1) + Number(s2.replace(
                '.', ''))
                * POW(10, m2))
                / POW(10, m3);
        }

        // 减法
        minus = function(a, b) {
            return plus(a, -b);
        }

        pow = function(a, b) {
            var re = String(POW(a, b)), i = re.indexOf('.');
            if (i != -1) {
                re = Number(re).toFixed(16 - i - 1)
            }
            return Number(re);
        }

    </script>

    function zip_str(strData) {
        return btoa(pako.gzip(encodeURIComponent(strData), {to: 'string'}));
    }

    function unzip_str(b64Data){
        var strData   = atob(b64Data);
        var charData  = strData.split('').map(function(x){return x.charCodeAt(0);});
        var binData   = new Uint8Array(charData);
        var data    = pako.inflate(binData);
        array = new Uint16Array(data)
        var res = '';
        var chunk = 8 * 1024;
        var i;
        for (i = 0; i < array.length / chunk; i++) {
            res += String.fromCharCode.apply(null, array.slice(i * chunk, (i + 1) * chunk));
        }
        res += String.fromCharCode.apply(null, array.slice(i * chunk));

        strData = res
        return decodeURIComponent(strData);
    }

    // 或得选择单元格
    function getSelectionBlock(selector) {
        var sheet = $(selector).data('kendoSpreadsheet').activeSheet(),
            selection = sheet.originalSelect(), result = [];

        if (selection.topLeft) { // 选中了多个单元格
            var topLeft = selection.topLeft,
                bottomRight = selection.bottomRight,
                i = topLeft.row,
                j = topLeft.col,
                iLen = bottomRight.row,
                jLen = bottomRight.col;
            for (; i <= iLen; i++) {
                for (j = topLeft.col; j <= jLen; j++) {
                    result.push(sheet.range(i, j));
                }
            }

        } else { // 选中了1个单元格
            result.push(sheet.range(selection.row, selection.col));
//                if (sheet.range(selection.row, selection.col).enable()) {
//                    sheet.range(selection.row, selection.col).enable(false);
//                } else {
//                    sheet.range(selection.row, selection.col).enable(true);
//                }
        }


        return result;

    var calcCountTimes = 0;

    function inTargetRange(currentTargetCellValue, lastTargetCellValue, targetColumnValue) {
        if ((targetColumnValue > currentTargetCellValue && targetColumnValue < lastTargetCellValue) || (targetColumnValue < currentTargetCellValue && targetColumnValue > lastTargetCellValue)) {
            return true;
        } else {
            return false;
        }
    }

    function setVariableCellValue(options) {
        options.variableCell = sheet.range(options.variableColumnCode);
        options.targetCell = sheet.range(options.targetColumnCode);
        var currentDisValue;
        var lastVariableFlag = options.lastVariableFlag;
        var currentDirectFlag = options.directFlag;
        var currentVariableCellValue = options.variableCell.value() || 0;
        var newSetVariableCellValue;
        if (lastVariableFlag == "NOUP") {
            newSetVariableCellValue = upperLimit;
        } else if (lastVariableFlag == "NODOWN") {
            newSetVariableCellValue = lowerLimit;
        } else {
            newSetVariableCellValue = div(plus(lowerLimit, upperLimit), 2);
        }
        options.variableCell.value(newSetVariableCellValue);
        if (options.targetCell.value().toFixed(8) * 1 != options.targetColumnValue && Math.abs(minus(newSetVariableCellValue, options.lastVariableCellValue)).toFixed(9) * 1 > 0.00000001 && Math.abs(minus(options.targetCell.value(), options.lastTargetCellValue)).toFixed(9) * 1 > 0.00000001) {
            currentDisValue = Math.abs(minus(options.targetCell.value(), options.targetColumnValue)).toFixed(9) * 1;
            calcCountTimes++;
            if (currentDisValue <= 0.00000001 || lowerLimit.toFixed(8) * 1 == upperLimit.toFixed(8) * 1) {
                mask.destroy();
                return;
            }
            if (calcCountTimes > 100) {
                console.log("计算次数超过100次，请核对预估值！");
                mask.destroy();
                return;
            }
            if (options.directFlag == "DOWN") {
                if (currentDisValue > options.lastDisValue || inTargetRange(options.targetCell.value(), options.lastTargetCellValue, options.targetColumnValue)) {
                    currentDirectFlag = 'UP';
                    lastVariableFlag = "UP";
                    lowerLimit = newSetVariableCellValue;
                    upperLimit = currentVariableCellValue;
                } else {
                    if (lastVariableFlag == "NODOWN") {
                        lowerLimit = mul(newSetVariableCellValue, 0.5);
                        upperLimit = newSetVariableCellValue;
                    } else {
                        upperLimit = newSetVariableCellValue;
                    }
                }
            } else if (options.directFlag == "UP") {
                if (currentDisValue > options.lastDisValue || inTargetRange(options.targetCell.value(), options.lastTargetCellValue, options.targetColumnValue)) {
                    currentDirectFlag = 'DOWN';
                    lastVariableFlag = "DOWN";
                    lowerLimit = currentVariableCellValue;
                    upperLimit = newSetVariableCellValue;
                } else {
                    if (lastVariableFlag == "NOUP") {
                        lowerLimit = newSetVariableCellValue;
                        upperLimit = mul(newSetVariableCellValue, 2);
                    } else {
                        lowerLimit = newSetVariableCellValue;
                    }
                }
            }
            setTimeout(function () {
                setVariableCellValue({
                    variableColumnCode: options.variableColumnCode,
                    targetColumnCode: options.targetColumnCode,
                    targetColumnValue: options.targetColumnValue,
                    sourceVariableCellValue: options.sourceVariableCellValue,
                    sourceTargetCellValue: options.sourceTargetCellValue,
                    directFlag: currentDirectFlag,
                    lastDisValue: currentDisValue,
                    lastVariableCellValue: options.variableCell.value(),
                    lastTargetCellValue: options.targetCell.value(),
                    lastVariableFlag: lastVariableFlag
                });
            }, 200);
        } else {
            mask.destroy();
        }
    }

    var sheet, lowerLimit, upperLimit;

    function calcTargetValue(event) {
        mask = jQuery("body").mLoading({
            text:"正在计算数据。。。"
        });
        setTimeout(function () {
            try {
                var targetColumnCode, targetColumnValue, variableColumnCode, guessValue,
                    buttonName = event.target.text();
                for (var i = 0; i < buttonDatas.length; i++) {
                    var buttonData = buttonDatas[i];
                    if (buttonName == buttonData.buttonName) {
                        targetColumnCode = buttonData.targetColumnCode;
                        targetColumnValue = buttonData.targetColumnValue;
                        variableColumnCode = buttonData.variableColumnCode;
                        guessValue = buttonData.guessValue;
                        break;
                    }
                }
                sheet = $("#spreadsheet").data('kendoSpreadsheet').activeSheet();
                lowerLimit = null;
                upperLimit = null;
                calcCountTimes = 0;
                var tempInnerColumnCode = null, tempInnerColumnValue = null, tempRange = sheet.range("DZ300"),
                    tempRangeFormula = tempRange.formula();
                if (variableColumnCode.indexOf("(") != -1) {
                    tempInnerColumnCode = variableColumnCode.substring(variableColumnCode.indexOf("(") + 1, variableColumnCode.length - 1);
                    try {
                        tempRange.formula(tempInnerColumnCode);
                        tempInnerColumnValue = tempRange.value();
                    } catch (e) {
                        kendo.ui.showInfoDialog({
                            title: $l('提示'),
                            message: tempInnerColumnCode + "-可变单元格可变值异常," + e.toString()
                        });
                        mask.destroy();
                        return;
                    }
                    if (isNaN(tempInnerColumnValue)) {
                        kendo.ui.showInfoDialog({
                            title: $l('提示'),
                            message: tempInnerColumnCode + "-可变单元格可变值不是一个数字！"
                        });
                        mask.destroy();
                        return;
                    } else if (tempInnerColumnValue) {
                        variableColumnCode = variableColumnCode.replace("(" + tempInnerColumnCode + ")", tempInnerColumnValue);
                    } else {
                        kendo.ui.showInfoDialog({
                            title: $l('提示'),
                            message: tempInnerColumnCode + "-可变单元格可变值不能为空！"
                        });
                        mask.destroy();
                        return;
                    }
                }
                var variableCell = sheet.range(variableColumnCode);
                if (guessValue) {
                    variableCell.value(guessValue);
                }
                if (targetColumnCode.indexOf("(") != -1) {
                    tempInnerColumnCode = targetColumnCode.substring(targetColumnCode.indexOf("(") + 1, targetColumnCode.length - 1);
                    try {
                        tempRange.formula(tempInnerColumnCode);
                        tempInnerColumnValue = tempRange.value();
                    } catch (e) {
                        kendo.ui.showInfoDialog({
                            title: $l('提示'),
                            message: tempInnerColumnCode + "-目标单元格可变值异常," + e.toString()
                        });
                        mask.destroy();
                        return;
                    }
                    if (isNaN(tempInnerColumnValue)) {
                        kendo.ui.showInfoDialog({
                            title: $l('提示'),
                            message: tempInnerColumnCode + "-目标单元格可变值不是一个数字！"
                        });
                        mask.destroy();
                        return;
                    } else if (tempInnerColumnValue) {
                        targetColumnCode = targetColumnCode.replace("(" + tempInnerColumnCode + ")", tempInnerColumnValue);
                    } else {
                        kendo.ui.showInfoDialog({
                            title: $l('提示'),
                            message: tempInnerColumnCode + "-目标单元格可变值不能为空！"
                        });
                        mask.destroy();
                        return;
                    }
                }
                tempRange.formula(tempRangeFormula);
                var targetCell = sheet.range(targetColumnCode);
                if (!variableCell.value()) {
                    kendo.ui.showInfoDialog({
                        title: $l('提示'),
                        message: "请先预估" + variableColumnCode + "的可变值！"
                    });
                    mask.destroy();
                    return;
                }
                if (!targetCell.value()) {
                    kendo.ui.showInfoDialog({
                        title: $l('提示'),
                        message: "目标单元格" + targetColumnCode + "不能为空！"
                    });
                    mask.destroy();
                    return;
                }
                var sourceVariableCellValue = variableCell.value() || 0;
                var sourceTargetCellValue = targetCell.value().toFixed(8) * 1 || 0;
                var sourceDisValue = Math.abs(minus(targetColumnValue, sourceTargetCellValue || 0)).toFixed(9) * 1;
                var currentDirectFlag, lastVariableFlag;
                if (sourceDisValue > 0.00000001) {
                    variableCell.value(mul(variableCell.value(), 0.99));
                    var currentDisValue = Math.abs(minus(targetColumnValue, targetCell.value() || 0)).toFixed(9) * 1;
                    if (currentDisValue > sourceDisValue) {
                        currentDirectFlag = "UP";
                        lowerLimit = sourceVariableCellValue;
                        upperLimit = mul(sourceVariableCellValue, 2);
                        lastVariableFlag = "NOUP";
                    } else {
                        currentDirectFlag = "DOWN";
                        lowerLimit = mul(sourceVariableCellValue, 0.5);
                        upperLimit = sourceVariableCellValue;
                        lastVariableFlag = "NODOWN";
                    }
                    variableCell.value(sourceVariableCellValue);
                    setVariableCellValue({
                        variableColumnCode: variableColumnCode,
                        targetColumnCode: targetColumnCode,
                        targetColumnValue: targetColumnValue,
                        sourceVariableCellValue: sourceVariableCellValue,
                        sourceTargetCellValue: sourceTargetCellValue,
                        directFlag: currentDirectFlag,
                        lastDisValue: sourceDisValue,
                        lastVariableCellValue: 0,
                        lastVariableFlag: lastVariableFlag,
                        lastTargetCellValue: sourceTargetCellValue
                    });
                } else {
                    mask.destroy();
                }
            } catch (e) {
                alert(e.toString());
                mask.destroy();
            }
        }, 500);
    }

                var sheetObj = getSheetBySheetName(fields[i]['sheet_name']);

    }


    function getChangeConfigField() {
        var url = location.search;//获取url中“？”符后的字串
        if (url.indexOf("?") != -1) {
            var params = url.substr(1);
            pParamArr = params.split("&");
            for (var i = 0; i < pParamArr.length; i++) {
                var key = pParamArr[i].split("=")[0];
                var value = pParamArr[i].split("=")[1];
                if (key != 'priceList' && key != 'sourceDocumentId' && key != 'sourceDocumentCategory' && key != 'quotationId' && key != 'readOnlyFlag' && key != 'changeReqFlag') {
                    changeFields.push({
                        key: key,
                        value: value
                    });
                }
            }
        }
    }

    function chengeReqCellByParam() {
        if (changeReqFlag == 'Y') {
            var changeColumn = {"priceList": priceList};
            getChangeConfigField();
            $.ajax({
                type: "POST",
                url: "${base.contextPath}/hls/calcConfig/column/query",
                data: JSON.stringify(changeColumn),
                dataType: "json",
                contentType: "application/json",
                success: function (datas) {
                    if (datas.success) {
                        var basicSheet = getSheetBySheetName("INPUT");
                        var data = datas.rows;
                        for (var i = 0; i < changeFields.length; i++) {
                            var changeField = changeFields[i];
                            var key = changeField.key;
                            var value = changeField.value;
                            for (var j = 0; j < data.length; j++) {
                                if(data[j].sheetName == 'INPUT') {
                                    var columnName = data[j].columnName;
                                    var columnCode = data[j].columnCode;
                                    if (key.toUpperCase() == columnName.toUpperCase()) {
                                        if (data[j].columnType == 'NUMBER') {
                                            basicSheet.range(columnCode).value(parseFloat(value));
                                        } else {
                                            basicSheet.range(columnCode).value(value);
                                        }

                                    }
                                }
                            }
                        }
                        /*calcQuotation(true);*/
                    }
                }
            });
        }
    }

    function getSheetBySheetName(name){
        var sheets = $("#spreadsheet").data('kendoSpreadsheet').sheets();
        for(var i = 0; i < sheets.length; i++){
            if(sheets[i]._sheetName == name){
                return sheets[i];
            }
        }
    }
</script>
</div>
