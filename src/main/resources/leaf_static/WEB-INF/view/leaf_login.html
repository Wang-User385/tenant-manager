<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8 no-js"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9 no-js"> <![endif]-->
<!--[if !IE]><!-->
<html>
<!--<![endif]-->
    <head>
        <meta charset="utf-8" />
        <title>GDH</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <link href="${base.contextPath}/lib/assets/global/plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="${base.contextPath}/lib/font-awesome-4.6.3/css/font-awesome.css" rel="stylesheet" type="text/css"/>
        <link href="${base.contextPath}/lib/assets/global/css/components.css" rel="stylesheet" id="style_components" type="text/css" />
        <link href="${base.contextPath}/lib/assets/global/css/plugins.css" rel="stylesheet" type="text/css" />
        <link href="${base.contextPath}/lib/assets/pages/css/leaf-login-5.css" rel="stylesheet" type="text/css" />
        <script src="${base.contextPath}/lib/assets/global/plugins/jquery.min.js" type="text/javascript"></script>
        <link href="${base.contextPath}/lib/assets/pages/img/favicon.ico" rel="shortcut icon"/>
        <script>var _baseContext = '${base.contextPath}'</script>
    </head>
    <body class=" login">
        <script>
            function changeCaptchaCode() {
                $("#imgObj").attr("src", '${base.contextPath}/verifiCode?_r='+Math.random());
            }

            document.onkeydown=function(event){
                var e = event || window.event || arguments.callee.caller.arguments[0];
                if(e && e.keyCode==13){ // enter 键
                    document.getElementById('loginForm').submit();
                }
            };
        </script>
        <style>
            @font-face{
                font-family: "FZIJSFW";
                src:url("${base.contextPath}/lib/assets/pages/img/login/NotoSansHans-Thin-Windows.otf") format("opentype");
                font-weight: normal;
                font-style: normal;
            }
            label,button{
                font-family: "FZIJSFW";
            }
            .user-login-5 input:-webkit-autofill {
                -webkit-box-shadow: 0 0 0 1000px white inset !important;
            }
            .row {
                 margin-left: 0px;
                 margin-right: 0px;
            }
            .row .col-md-6 .login-content .img-style{

            }
        </style>
        <!-- BEGIN : LOGIN PAGE 5-1 -->
        <div class="user-login-5">
            <script>
                if(top.sessionExpiredLogin){
                    top.sessionExpiredLogin();
                    $('.user-login-5').hide();
                }
            </script>
            <div class="row bs-reset">
                <div class="col-md-6 bs-reset">
                    <div class="login-bg" style="background-image:url(${base.contextPath}/lib/assets/pages/img/login/bg1.jpg)">
<!--                        <img class="login-logo" src="${base.contextPath}/leafresources/upload/logo.png" width="140"/>-->
                    </div>
                </div>
                <div class="col-md-6 login-container bs-reset">
                    <div class="login-content" style="width: 404px;margin: 0 auto;padding:0px;margin-top: 35%;">
                        <!--<h1>HAND Leasing System Login</h1>-->
                        <div class="img-style">
                            <img src="${base.contextPath}/lib/assets/pages/img/login/login-logo-pre.png" style="height: 24px;width:29px;margin-right: 10px"/>
                            <img src="${base.contextPath}/lib/assets/pages/img/login/login-logo-next.png" style="height: 13px;width:228px;margin-top: 6px"/>
                        </div>
                        <#if msg?exists>
                            <div class="alert alert-danger">
                                <button class="close" data-close="alert"></button>
                                <span>${msg!}</span>
                            </div>
                        </#if>
                        <form id="loginForm" style="margin-top: 32px;" class="login-form" action="login" method="post" autocomplete="off">
                            <input type="password" hidden="">
                            <div class="row">
                                <label style="width:49px;height:16px;color:#666666;font-size:14px;float: left;margin-bottom: 0px;margin-left: 2px;margin-right: 1px">用户名</label>
                                <div class="col-xs-12 col-sm-6" style="width: 153px;padding:0;margin-right: 8px">
                                    <input class="form-control form-control-solid placeholder-no-fix" style="font-size:14px;padding: 0px;margin-bottom: 0px;height: 19px;width: 153px" type="text" autocomplete="off"  name="username" />
                                </div>
                                <label style="color:#666666;font-size:14px;float: left;margin-bottom: 0px;margin-right: 3px">密码</label>
                                <div class="col-xs-12 col-sm-6" style="width: 153px;padding:0;">
                                    <input style="font-size:14px;padding: 0px;margin-bottom: 0px;height: 19px" class="form-control form-control-solid placeholder-no-fix <#if code! == "LOGIN_NOT_MATCH">error</#if>" id="password" type="text" autocomplete="off" name="password"/>
                                    <script type="text/javascript">
                                        $('#password').on('focus',function(){
                                            $(this).attr('type','password');
                                        })
                                    </script>
                               </div>
                            </div>

                            <div class="row" style="margin-top: 18px">
                                <#if ENABLE_CAPTCHA >
                                <label style="color:#666666;font-size:14px;float: left;width: 50px;height: 16px;margin-bottom: 0px">验证码</label>
                                </#if>
                                <div class="col-sm-6"  style="position:relative;width: 259px;padding:0;">
                                    <#if ENABLE_CAPTCHA >
                                        <input style="font-size:14px;margin-bottom: 0px;padding: 0px;height: 19px;margin-right: 12px" class="form-control form-control-solid placeholder-no-fix <#if code! == 'CAPTCHA_INVALID'>error</#if>" type="text" name="verifiCode" />
                                        <img id="imgObj" title="<@spring.message 'sys.login.refreshverificationcode'/>" src="${base.contextPath}/verifiCode" style="cursor:pointer;position:absolute;right:-90px;top:-8px;width:79px;height: 32px;" onclick="changeCaptchaCode()" />

                                    </#if>
                                </div>

                            </div>
                            <div class="row" style="margin-top: 20px">
                                <div class="col-sm-12 text-right" style="padding: 0px;width: 404px;height: 40px">
                                    <!--<div class="forgot-password">-->
                                    <!--<a href="javascript:;" id="forget-password" class="forget-password">忘记密码 ?</a>-->
                                    <!--</div>-->
                                    <button class="btn blue" type="submit" style="font-size:14px;height:40px;min-width:100px;width:100%;background-color: #47484c;border-radius: 5px !important;    border-color: #47484c;letter-spacing:4px"><@spring.message "hap.login"/></button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="login-footer">
                        <div class="row bs-reset">
                            <div class="col-xs-12 bs-reset">
                                <div class="login-copyright text-right" style="font-size: 8px;text-align: right;padding: 0px;margin-right: 20px;">
                                    <p>  Copyright © 1996 - 2018 上海汉得信息技术股份有限公司.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--[if lt IE 9]>
        <script src="${base.contextPath}/lib/assets/global/plugins/respond.min.js"></script>
        <script src="${base.contextPath}/lib/assets/global/plugins/excanvas.min.js"></script>
        <![endif]-->
        <script src="${base.contextPath}/lib/assets/global/plugins/backstretch/jquery.backstretch.min.js" type="text/javascript"></script>
        <script src="${base.contextPath}/lib/assets/pages/scripts/login-5.js" type="text/javascript"></script>
    </body>
</html>
