    <body class="login">
<script>
    window.onload=function(){
        document.getElementsByTagName("img")[0].style.height='100%';
        document.getElementsByTagName("img")[0].style.width='100%';
        document.getElementsByTagName("img")[0].style.top='0px';
    }
</script>

        <div class="user-login-5">
            <div class="row bs-reset">
                <div class="col-md-6 bs-reset" style="width:100%;position: absolute;left: 0px;">
                    <div class="login-bg"
                         style="background-image:url(${base.contextPath}/lib/assets/pages/img/login/bg5.png)">
<!--                        <img class="login-logo" src="${base.contextPath}/lib/assets/pages/img/login/xy_logo.png"-->
<!--                             width="107" style="margin: 16px 0 0 16px"/>-->
                    </div>
                </div>
                <div class="col-md-6 login-container bs-reset" style="position:absolute;right:0px;width: 40%;background: url('${base.contextPath}/resources/images/index-login.png');background-size: 100% 100%;">
                    <div class="login-content">
                        <div class="login-icon">
                            <img style="height: 28px">
                        </div>

                        <form class="login-form" autocomplete="off" action="${base.contextPath}/password/reset" method="post">
                            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                            <h4 style="text-align: center;">${update_password_title!}</h4>
                            <#if message?exists>
                            <div class="alert alert-danger">
                                <button class="close" data-close="alert"></button>
                                <span>${message!}</span>
                            </div>
                            </#if>
                            <div class="row" style="margin-top: 60px;">
                                <div class="col-sm-12 col-md-6">
                                    <input class="password-input form-control form-control-solid placeholder-no-fix" type="text" name="newPwd" autocomplete="off" placeholder="<@spring.message 'user.new_password'/>"/>
                                </div>
                                <div class="col-sm-12 col-md-6">
                                    <input class="password-input form-control form-control-solid placeholder-no-fix" type="text" name="newPwdAgain" autocomplete="off" placeholder="<@spring.message 'user.again_new_password'/>"/>
                                </div>
                                <script type="text/javascript">
                                    $('.password-input').one('focus',function(){
                                        $(this).attr('type','password');
                                    })
                                </script>
                            </div>
                            <div class="row">
                                <div class="col-sm-12 col-md-12" style="margin-top: 20px;">
                                    <button class="btn blue" type="submit" style="width:100%;" ><@spring.message "hap.save"/></button>
                                </div>
                            </div>

                        </form>
                    </div>
                    <div class="login-footer" style="position: fixed;bottom: 10px;right: 10px;">
                        <div class="row bs-reset">
                            <div class="col-xs-12 bs-reset">
                                <div class="login-copyright text-right">
