<html>

    <head>
        <meta charset="utf-8" />
        <title>GDH</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta content="width=device-width, initial-scale=1" name="viewport" />        
        <link href="${base.contextPath}/lib/assets/global/plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="${base.contextPath}/lib/font-awesome-4.6.3/css/font-awesome.css" rel="stylesheet" type="text/css"/>
        <link href="${base.contextPath}/lib/assets/global/css/components.css" rel="stylesheet" id="style_components" type="text/css" />
        <link href="${base.contextPath}/lib/assets/global/css/plugins.css" rel="stylesheet" type="text/css" />
        <link href="${base.contextPath}/lib/assets/pages/css/leaf-login-5.css" rel="stylesheet" type="text/css" />
        <script src="${base.contextPath}/lib/assets/global/plugins/jquery.min.js" type="text/javascript"></script>
        <link href="${base.contextPath}/lib/assets/pages/img/favicon.ico" rel="shortcut icon"/>
        <script>var _baseContext = '${base.contextPath}'</script>
    </head>
    <style>
        @font-face{
            font-family: "FZIJSFW";
            src:url("${base.contextPath}/lib/assets/pages/img/login/NotoSansHans-Thin-Windows.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }
        label,button,select,div{
            font-family: "FZIJSFW";
        }
        #roleSelect{
            border: none;
            outline: none;
            width: 350px;
            height: 40px;
            line-height: 25px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-left: 40px;
            border-radius: 10px !important;
            color: #666666;
        }
        .clear_default{
            position: relative;
            margin-bottom:15px;
            border-radius: 5px !important;
            height: 40px;
            border: 1px solid #C9C9C9;
        }
        .select-down{
            /*content: "";*/
            width: 13px;
            height: 12px;
            background: url("${base.contextPath}/lib/assets/pages/img/login/select.png") no-repeat center;
            position: absolute;
            right: 20px;
            top: 14px;
            pointer-events: none;
        }
        .line{
            position: absolute;
            height: 12px;
            background: #C9C9C9;
            width: 1px;
            right: 55px;
            top: 14px;
            color: #666666;
        }
    </style>
    <body class=" login">
        <!-- BEGIN : LOGIN PAGE 5-1 -->
        <div class="user-login-5">
            <div class="row bs-reset">
                <div class="col-md-6 bs-reset">
                    <div class="login-bg" style="background-image:url(${base.contextPath}/lib/assets/pages/img/login/bg1.jpg)">
                        <!--<img class="login-logo" src="${base.contextPath}/leafresources/upload/logo.png" width="140"/>-->
                    </div>
                </div>
                <div class="col-md-6 login-container bs-reset">
                    <div class="login-content" style="width: 404px;padding:0px;margin:0 auto;margin-top: 35%;">
                        <!--<h1>HAND Leasing System Login</h1>-->
                        <!--<img src="${base.contextPath}/lib/assets/pages/img/login/login-logo.png" style="display: inline-block;margin-bottom: 23px;"/>-->
                        <img src="${base.contextPath}/lib/assets/pages/img/login/login-logo-pre.png" style="height: 24px;width:29px;margin-right: 10px"/>
                        <img src="${base.contextPath}/lib/assets/pages/img/login/login-logo-next.png" style="height: 13px;width:228px;margin-top: 6px;"/>
                         <form id="roleSelectForm" style="margin-top:16px;"  class="form-horizontal login-form" action="hlsRole" method="POST">
                             <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
                             <div class="row">
                                <div class="col-xs-12 col-sm-12" style="width: 404px">
                                    <div class="clear_default">
                                        <div class="line"></div>
                                        <select id="roleSelect" name="roleIdStr" class="bs-select form-control" style="font-size:12px;height:35px;padding-left: 20px">
                                          <#list roles as role>
                                             <option value="${role.userRoleGroupId!}-${role.roleId!}-${role.companyId}">${role.roleName!''}-${role.companyDescription!''}</option>
                                          </#list>
                                        </select>
                                        <div class="select-down"></div>
                                    </div>
                               </div>
                           </div>
                             <div class="row">
                                 <div class="col-xs-12 col-sm-12" style="width: 404px;">
                                     <button type="submit" style="font-size:14px;height:40px;min-width:100px;width:100%;background-color: #47484c;border-radius: 5px !important;    border-color: #47484c;letter-spacing:4px" class="btn blue"><@spring.message "hap.ok"/> <!--<i class="m-icon-swapright m-icon-white"></i>--></button>
                                 </div>
                             </div>
                        </form>
                        <!--<script>-->
                           <!--if($('#roleSelect').find('option').length==1){-->
                              <!--document.getElementById('roleSelectForm').submit();-->
                             <!--}-->
                           <!--</script>-->
                    </div>
                    <div class="login-footer">
                        <div class="row bs-reset">
                            <div class="col-xs-12 bs-reset">
                                <div class="login-copyright text-right" style="font-size: 8px;text-align: right;padding: 0px;margin-right: 20px;">
                                    <p>  Copyright © 1996 - 2018 上海汉得信息技术股份有限公司.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            document.onkeydown=function(event){
                var e = event || window.event || arguments.callee.caller.arguments[0];
                if(e && e.keyCode==13){ // enter 键
                    document.getElementById('roleSelectForm').submit();
                }
            };
        </script>
