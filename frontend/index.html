<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>租户管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .card { margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .action-btn { margin-right: 5px; }
    </style>
</head>
<body>
<div id="app" class="container">
    <h2 class="text-center">🏢 租户管理系统</h2>

    <div class="row mb-3">
        <div class="col-md-8">
            <input type="text" v-model="searchKeyword" @input="searchTenants" placeholder="搜索租户名称/联系人..." class="form-control">
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary" @click="showAddModal">+ 新增租户</button>
            <button class="btn btn-secondary" @click="loadTenants">刷新列表</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名称</th>
                        <th>联系人</th>
                        <th>电话</th>
                        <th>地址</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="tenant in tenants" :key="tenant.id">
                        <td>{{ tenant.id }}</td>
                        <td>{{ tenant.name }}</td>
                        <td>{{ tenant.contact }}</td>
                        <td>{{ tenant.phone }}</td>
                        <td>{{ tenant.address }}</td>
                        <td>
                            <span class="badge" :class="tenant.status === 'ACTIVE' ? 'bg-success' : 'bg-danger'">
                                {{ tenant.status }}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-warning action-btn" @click="editTenant(tenant)">编辑</button>
                            <button class="btn btn-sm btn-danger action-btn" @click="deleteTenant(tenant.id)">删除</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 新增/编辑弹窗（已补全 photoUrl + status） -->
    <div class="modal fade" id="tenantModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">{{ isEdit ? '编辑租户' : '新增租户' }}</h5>
                    <button type="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label>名称</label>
                            <input type="text" v-model="form.name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>联系人</label>
                            <input type="text" v-model="form.contact" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>电话</label>
                            <input type="text" v-model="form.phone" class="form-control">
                        </div>

                        <!-- 👇 新增：照片地址 -->
                        <div class="mb-3">
                            <label>照片地址（URL）</label>
                            <input type="text" v-model="form.photoUrl" class="form-control" placeholder="选填">
                        </div>

                        <div class="mb-3">
                            <label>地址</label>
                            <input type="text" v-model="form.address" class="form-control">
                        </div>

                        <!-- 👇 新增：状态选择 -->
                        <div class="mb-3">
                            <label>状态</label>
                            <select v-model="form.status" class="form-select">
                                <option value="ACTIVE">正常（ACTIVE）</option>
                                <option value="INACTIVE">停用（INACTIVE）</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" @click="saveTenant">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            baseUrl: 'https://tenant-manager-xpnz.onrender.com/api/tenants',
            tenants: [],
            searchKeyword: '',
            isEdit: false,
            // 👇 已补全 photoUrl + status
            form: { id: null, name: '', contact: '', phone: '', photoUrl: '', address: '', status: 'ACTIVE' },
            modal: null
        },
        mounted() {
            this.modal = new bootstrap.Modal(document.getElementById('tenantModal'));
            this.loadTenants();
        },
        methods: {
            async loadTenants() {
                const res = await fetch(this.baseUrl);
                const json = await res.json();
                this.tenants = json.data || [];
            },
            async searchTenants() {
                if (!this.searchKeyword) return this.loadTenants();
                const res = await fetch(`${this.baseUrl}/search?keyword=${this.searchKeyword}`);
                const json = await res.json();
                this.tenants = json.data || [];
            },
            showAddModal() {
                this.isEdit = false;
                this.form = { name: '', contact: '', phone: '', photoUrl: '', address: '', status: 'ACTIVE' };
                this.modal.show();
            },
            editTenant(tenant) {
                this.isEdit = true;
                this.form = { ...tenant };
                this.modal.show();
            },
            async saveTenant() {
                const url = this.isEdit ? `${this.baseUrl}/${this.form.id}` : this.baseUrl;
                const method = this.isEdit ? 'PUT' : 'POST';
                
                await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                
                this.modal.hide();
                this.loadTenants();
            },
            async deleteTenant(id) {
                if (confirm('确定要删除该租户吗？')) {
                    await fetch(`${this.baseUrl}/${id}`, { method: 'DELETE' });
                    this.loadTenants();
                }
            }
        }
    });
</script>
</body>
</html>
